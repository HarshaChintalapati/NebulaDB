// gRPC service for NebulaDB: Raft RPCs between replicas, and client key-value requests.
syntax = "proto3";

package nebuladb;

option java_package = "dev.nebuladb.net.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "NebulaProto";

service NebulaRpc {
  // Raft (one call per message, unary; each request names its Raft group = shard)
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  rpc AppendEntries(AppendRequest) returns (AppendResponse);
  // Client: run a key-value command on a shard's leader
  rpc Kv(KvRequest) returns (KvResponse);
}

message Entry {
  int64 index = 1;
  int64 term = 2;
  bytes command = 3;   // dev.nebuladb.kv.Command encoding; empty = leader no-op
}

message VoteRequest {
  int32 group = 1;
  int64 term = 2;
  string candidate_id = 3;
  int64 last_log_index = 4;
  int64 last_log_term = 5;
}

message VoteResponse {
  int64 term = 1;
  bool granted = 2;
}

message AppendRequest {
  int32 group = 1;
  int64 term = 2;
  string leader_id = 3;
  int64 prev_log_index = 4;
  int64 prev_log_term = 5;
  repeated Entry entries = 6;
  int64 leader_commit = 7;
}

message AppendResponse {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3;  // on failure: hint, retry from match_index + 1
}

message KvRequest {
  int32 shard = 1;
  bytes command = 2;
}

enum KvStatus {
  OK = 0;
  NOT_LEADER = 1;
  ERROR = 2;
}

message KvResponse {
  KvStatus status = 1;
  bool has_value = 2;     // proto3 strings can't be null, so presence is explicit
  string value = 3;
  string info = 4;        // leader hint or error message; empty = none
}
